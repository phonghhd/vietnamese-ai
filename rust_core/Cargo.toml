[package]
name = "vietnamese_ai_rust"
version = "31.3.0"
edition = "2021"

[lib]
name = "vietnamese_ai_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.0", features = ["extension-module", "abi3-py39"] }
rayon = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
