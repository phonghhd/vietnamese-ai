version: "3.8"

services:
  vai-train:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["train", "--data", "/app/data/train.csv", "--output", "/app/models/model.pkl"]

  vai-serve:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
    command: ["serve", "--model", "/app/models/model.pkl", "--port", "8080"]
    restart: unless-stopped

  vai-evaluate:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["evaluate", "--model", "/app/models/model.pkl", "--data", "/app/data/test.csv"]
