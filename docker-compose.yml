services:
  vietnamese-ai-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietnamese-ai-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/overview')"]
      interval: 30s
      timeout: 5s
      retries: 3
