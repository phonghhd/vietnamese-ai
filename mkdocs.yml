site_name: Vietnamese AI Framework
site_description: Framework AI thuần tiếng Việt cho Python - Micro-Core, Swarm CPU Sharding, Verifiable AI, Legal RAG
site_url: https://phonghhd.github.io/vietnamese-ai
repo_url: https://github.com/phonghhd/vietnamese-ai
repo_name: phonghhd/vietnamese-ai

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Chế độ tối
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Chế độ sáng
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Trang chủ: index.md
  - Bắt đầu:
    - Cài đặt: getting-started/installation.md
    - Sử dụng nhanh: getting-started/quickstart.md
  - Trụ cột Chiến lược v31:
    - Swarm CPU & LAN Parallelism: guides/swarm-cpu.md
    - Verifiable AI (Proof of Inference): guides/verifiable-ai.md
    - RAG Pháp lý & Hành chính: guides/vietnamese-rag.md
    - Phòng thủ Dữ liệu & Khiên Đa lớp: guides/data-defense.md
    - Tác tử StateGraph & MCP: guides/state-graph-agents.md
    - Hồ Dữ liệu 16 Tập (DataLake): guides/datalake-16-datasets.md
    - Bảng So sánh Thực nghiệm: guides/comparative-benchmark.md
  - Hướng dẫn Cốt lõi:
    - Phân loại: guides/classification.md
    - Hồi quy: guides/regression.md
    - Xử lý văn bản: guides/text-processing.md
    - AutoML: guides/automl.md
    - Pipeline: guides/pipeline.md
    - Mobile/Edge: guides/mobile.md
    - Federated Learning: guides/federated.md
    - Real-time Pipeline: guides/realtime.md
    - Cloud SaaS: guides/saas.md
    - No-code Studio: guides/studio.md
    - Vietnamese LLM: guides/llm.md
    - PEFT & Instruction Tuning: guides/peft.md
    - SFT, DPO & RLHF: guides/sft-dpo-rlhf.md
    - GPT Pre-training: guides/gpt-pretraining.md
    - Evaluation & Benchmarks: guides/evaluation.md
    - RAG Pipeline: guides/rag.md
    - Serving & Streaming: guides/serving.md
    - Prompt Engineering: guides/prompts.md
    - NLP Extensions: guides/nlp-extensions.md
    - Model Compression: guides/compression.md
    - Production Hardening: guides/production.md
    - Self-Adapting LMs (SALM): guides/salm.md
    - Google Colab / Kaggle: guides/google-colab-kaggle.md
    - Trạng thái v30: guides/trang-thai-v30.md
  - API Reference:
    - Models: api/models.md
    - Preprocessing: api/preprocessing.md
    - Core: api/core.md
    - Utils: api/utils.md
    - Mobile/Edge: api/mobile.md
    - Federated: api/federated.md
    - Real-time: api/realtime.md
    - Cloud SaaS: api/saas.md
    - Studio: api/studio.md
    - LLM: api/llm.md
    - NAS: api/nas.md
    - PEFT: api/peft.md
    - Training (SFT/DPO/RLHF): api/training.md
    - GPT & PreTrainer: api/gpt.md
    - Evaluation: api/evaluation.md
    - RAG: api/rag.md
    - Serving: api/serving.md
    - Prompts: api/prompts.md
    - NLP Extensions: api/nlp-extensions.md
    - Compression: api/compression.md
    - Production: api/production.md
    - SALM: api/salm.md
  - Lịch sử Phiên bản:
    - v12 Tác tử (Agents): guides/v12-agents.md
    - v13 Biên mạng (Edge): guides/v13-edge.md
    - v14 RAG Nâng cao: guides/v14-advanced-rag.md
    - v17 An ninh (Security): guides/v17-security.md
    - v18-v20 Tiến hoá: guides/v18-v20-evolution.md
    - v21-v23 Tiến hoá: guides/v21-v23-evolution.md
    - v27 Phần cứng Cực hạn: guides/v27-hardware-extreme.md
    - v28 Spatial AI: v28_spatial_ai.md
    - v29 Mobile AI: v29_mobile_ai.md
    - v30 Mobile SDK: v30_mobile_sdk.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
