[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-ai-zkml"
version = "31.3.0"
description = "Mật mã học xác thực suy luận AI: CayMerkleSuyLuan, Schnorr/Fiat-Shamir RFC 5114 & KiemToanMatMa"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "vietnamese-ai>=31.3.0,<32.0.0",
    "numpy>=1.20.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["vietnamese_ai.crypto*", "vietnamese_ai.zkml*"]
