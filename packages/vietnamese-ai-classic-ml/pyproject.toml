[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-ai-classic-ml"
version = "31.0.3"
description = "Gói mở rộng Học máy cổ điển tiếng Việt (PhanLoai, HoiQuy, PhanCum, MangNron)"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0,<3.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
tabular = [
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["vietnamese_ai.classic_ml*", "vietnamese_ai.models*"]
