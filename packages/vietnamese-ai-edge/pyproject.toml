[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-ai-edge"
version = "31.3.0"
description = "Động cơ suy luận Zero-GPU Edge CPU: GGUF mmap, Q2_K/Q3_K/Q4_K/Q4_0/Q4_1/Q8_0, Swarm CPU LAN"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "vietnamese-ai>=31.3.0,<32.0.0",
    "numpy>=1.20.0,<3.0.0",
]

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python>=0.2.0",
]
export = [
    "onnxruntime>=1.16.0",
    "gguf>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["vietnamese_ai.edge*", "vietnamese_ai.core.edge*"]
