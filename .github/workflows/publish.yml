name: Publish Python Package to PyPI

# Kịch bản này sẽ tự động chạy khi bạn push một "tag" phiên bản (ví dụ: v20.0.0) lên GitHub
on:
  push:
    tags:
      - 'v*.*.*'  # Kích hoạt khi tag có định dạng vX.Y.Z
      - 'v*.*'    # Kích hoạt khi tag có định dạng vX.Y

jobs:
  build-and-publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x" # Sử dụng phiên bản Python 3 mới nhất

      - name: Cài đặt các công cụ đóng gói
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Đóng gói project (từ pyproject.toml)
        run: python -m build

      - name: Upload lên PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}