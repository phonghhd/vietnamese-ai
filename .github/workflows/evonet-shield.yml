name: EvoNet Security Shield

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'      
      - '*.json'    
      - 'README.md'
  pull_request:
    branches: [ main ]

jobs:
  evonet-scan:
    name: EvoNet AI Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn về
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛡️ Khởi động máy quét EvoNet-AI-Core
        run: python scripts/evonet_mock_scanner.py

      - name: 📡 Gửi mã nguồn thật về trung tâm EvoNet
        run: |
          echo "Bắt đầu trích xuất Git Diff..."
          # Lấy nội dung thay đổi giữa commit hiện tại và commit trước đó
          DIFF_CONTENT=$(git diff HEAD^ HEAD)
          
          # Lấy mã SHA của commit để dễ dò vết
          COMMIT_SHA=${{ github.sha }}

          # MỚI: Tự động lấy tên cái file vừa bị sếp sửa/thêm mã độc (lấy file đầu tiên)
          CHANGED_FILE=$(git diff HEAD^ HEAD --name-only | head -n 1)
          echo "Tập tin bị theo dõi: $CHANGED_FILE"
          
          # Dùng jq để đóng gói an toàn, THÊM BIẾN file_path VÀO CỤM NÀY
          JSON_PAYLOAD=$(jq -n \
            --arg repo "vietnamese-ai" \
            --arg branch "main" \
            --arg commit "$COMMIT_SHA" \
            --arg code "$DIFF_CONTENT" \
            --arg file_path "$CHANGED_FILE" \
            '{repo: $repo, branch: $branch, commit_sha: $commit, code_diff: $code, file_path: $file_path}')
          
          echo "Đang bắn dữ liệu lên máy chủ Render..."
          
          # Gọi API của EvoNet với khối dữ liệu chuẩn
          RESPONSE=$(curl -s -X POST https://evonet-ai-core.onrender.com/api/v1/scan \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          echo "🤖 Phản hồi từ EvoNet AI: $RESPONSE"
          
          # Logic gác cổng: Nếu EvoNet chê, đánh sập băng chuyền ngay lập tức
          if echo "$RESPONSE" | grep -q "VULNERABILITY_FOUND"; then
            echo "❌ EvoNet phát hiện mã độc! Khóa chặn luồng hợp nhất (Merge)!"
            exit 1
          else
            echo "✅ EvoNet xác nhận mã nguồn sạch sẽ, cho phép thông qua!"
          fi
