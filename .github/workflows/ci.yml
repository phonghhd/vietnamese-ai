name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"

    - name: Debug info
      run: |
        python --version
        pip list
        python -c "import vietnamese_ai; print('OK:', vietnamese_ai.__version__); assert vietnamese_ai.__version__ == '30.1.0'"

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short \
          --cov=vietnamese_ai \
          --cov-report=term-missing:skip-covered \
          --cov-fail-under=25

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Lint with ruff
      run: ruff check vietnamese_ai/ tests/ --select E,F,W,I --ignore E501,E402

    - name: Type check with mypy
      run: mypy vietnamese_ai/ --ignore-missing-imports --no-error-summary || true
