name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-and-security-gates:
    name: Lint, Type Check, SemVer, Crypto & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          pip install mkdocs mkdocs-material

      - name: Lint with ruff
        run: ruff check vietnamese_ai/ tests/ benchmarks/

      - name: Type check with mypy (strict zero-error gate)
        run: mypy vietnamese_ai/ --ignore-missing-imports

      - name: Verify SemVer synchronization across root and sub-packages
        run: |
          python -c "
          import vietnamese_ai
          from vietnamese_ai.utils.versioning import PHIEN_BAN_CHUAN, QuanLyPhatHanhGoi
          assert vietnamese_ai.__version__ == PHIEN_BAN_CHUAN, f'Version mismatch: {vietnamese_ai.__version__} != {PHIEN_BAN_CHUAN}'
          kq = QuanLyPhatHanhGoi.kiem_tra_tuan_thu_semver('.')
          print('SemVer report:', kq)
          assert kq['hop_le_semver'] and kq['dong_bo_phien_ban'], f'SemVer check failed: {kq}'
          "

      - name: Verify dependency extras have zero conflicts
        run: |
          python -c "
          from vietnamese_ai.utils import QuanLyPhuThuoc
          kq = QuanLyPhuThuoc.kiem_tra_xung_dot_phu_thuoc()
          print('Dependency audit:', kq)
          assert kq['hop_le'], f'Dependency conflict detected: {kq}'
          "

      - name: Run automated cryptographic audit (RFC 5114 & RFC 6962)
        run: |
          python -c "
          from vietnamese_ai.crypto import KiemToanMatMa
          kq = KiemToanMatMa.chay_kiem_toan_tu_dong()
          print('Crypto audit:', kq)
          assert kq['tong_quan_dat'], f'Crypto audit failed: {kq}'
          "

      - name: Build MkDocs documentation (strict mode)
        run: mkdocs build --strict

  test:
    name: Pytest Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=vietnamese_ai \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=65
