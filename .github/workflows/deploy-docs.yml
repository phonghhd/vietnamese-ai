name: 🚀 Deploy Vietnamese-AI Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 🛠️ Build & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Lấy mã nguồn về
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt thư viện MkDocs & Giao diện Material
        run: |
          pip install mkdocs-material
          pip install "mkdocstrings[python]"

      - name: 🌐 Build và xuất bản lên GitHub Pages
        run: mkdocs gh-deploy --force
