[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-ai"
version = "31.0.0"
description = "Framework AI thuần tiếng Việt cho Python - Vietnamese AI Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "EvoNet AI Team", email = "huynhduongphong9@gmail.com"},
]
keywords = ["ai", "machine-learning", "vietnamese", "nlp", "deep-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Vietnamese",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
]
tabular = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
viz = ["matplotlib>=3.4.0"]
nlp = ["underthesea>=6.0"]
torch = ["torch>=2.0"]
transformers = ["transformers>=4.30", "torch>=2.0"]
dl = ["torch>=2.0", "transformers>=4.30"]
fast = ["unsloth", "liger-kernel"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
llm = [
    "openai>=1.0.0",
    "google-genai>=1.0.0; python_version >= '3.9'",
    "google-generativeai>=0.8.0; python_version < '3.9'",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
rag = [
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "pypdf>=3.0.0",
    "sentence-transformers>=2.2.2",
    "networkx>=2.6",
]
full = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.4.0",
    "underthesea>=6.0",
    "torch>=2.0",
    "transformers>=4.30",
    "openai>=1.0.0",
    "google-genai>=1.0.0; python_version >= '3.9'",
    "google-generativeai>=0.8.0; python_version < '3.9'",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "pypdf>=3.0.0",
    "sentence-transformers>=2.2.2",
    "networkx>=2.6",
]
all = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.4.0",
    "underthesea>=6.0",
    "torch>=2.0",
    "transformers>=4.30",
    "openai>=1.0.0",
    "google-genai>=1.0.0; python_version >= '3.9'",
    "google-generativeai>=0.8.0; python_version < '3.9'",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "pypdf>=3.0.0",
    "sentence-transformers>=2.2.2",
    "networkx>=2.6",
]

[project.urls]
Homepage = "https://github.com/phonghhd/vietnamese-ai"
Documentation = "https://phonghhd.github.io/vietnamese-ai"
Repository = "https://github.com/phonghhd/vietnamese-ai"
Issues = "https://github.com/phonghhd/vietnamese-ai/issues"
Changelog = "https://github.com/phonghhd/vietnamese-ai/blob/main/CHANGELOG.md"

[project.scripts]
vai = "vietnamese_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["vietnamese_ai*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
vietnamese_ai = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
