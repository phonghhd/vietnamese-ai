[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-ai"
version = "31.0.4"
description = "Framework AI thuần tiếng Việt cho Python - Vietnamese AI Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "EvoNet AI Team", email = "huynhduongphong9@gmail.com"},
]
keywords = ["ai", "machine-learning", "vietnamese", "nlp", "deep-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Vietnamese",
]
dependencies = [
    "numpy>=1.20.0,<3.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
]
classic-ml = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
]
tabular = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
viz = ["matplotlib>=3.4.0"]
nlp = ["underthesea>=6.0"]
vietnamese-nlp = ["underthesea>=6.0"]
vision = [
    "pillow>=9.0.0",
    "pytesseract>=0.3.10",
]
torch = ["torch>=2.0.0"]
transformers = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
dl = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.7.0",
    "trl>=0.8.0",
    "datasets>=2.14.0",
]
fast = [
    "unsloth",
    "liger-kernel",
]
export = [
    "onnxruntime>=1.16.0",
    "skl2onnx>=1.15.0",
    "gguf>=0.6.0",
]
mobile = [
    "psutil>=5.9.0",
    "pillow>=9.0.0",
    "websockets>=11.0",
    "onnxruntime>=1.16.0",
]
web3 = [
    "requests>=2.25.0",
]
robotics = [
    "numpy>=1.20.0,<3.0.0",
]
tracking = [
    "mlflow>=2.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "tomli>=2.0.0; python_version < '3.11'",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
llm = [
    "openai>=1.0.0",
    "google-genai>=1.0.0; python_version >= '3.9'",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
]
local-llm = [
    "llama-cpp-python>=0.2.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
grpc = [
    "grpcio>=1.56.0",
    "protobuf>=4.23.0",
]
rag = [
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "pypdf>=3.0.0",
    "sentence-transformers>=2.2.2",
    "networkx>=2.6",
]
