    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "pdfplumber>=0.10.0",
    "pillow>=9.0.0",
    "pytesseract>=0.3.10",
]
audio = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
]
ocr-vn = [
    "pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "paddleocr>=2.7.0",
    "easyocr>=1.7.0",
    "vietocr>=0.3.13",
]
cloud-gpu = [
    "modal>=0.64.0",
]
full = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.4.0",
    "underthesea>=6.0",
    "pillow>=9.0.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0; python_version >= '3.9'",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "pypdf>=3.0.0",
    "sentence-transformers>=2.2.2",
    "networkx>=2.6",
]
all = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.4.0",
    "underthesea>=6.0",
    "pillow>=9.0.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0; python_version >= '3.9'",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "pypdf>=3.0.0",
    "sentence-transformers>=2.2.2",
    "networkx>=2.6",
]

[project.urls]
Homepage = "https://github.com/phonghhd/vietnamese-ai"
Documentation = "https://phonghhd.github.io/vietnamese-ai"
Repository = "https://github.com/phonghhd/vietnamese-ai"
Issues = "https://github.com/phonghhd/vietnamese-ai/issues"
Changelog = "https://github.com/phonghhd/vietnamese-ai/blob/main/CHANGELOG.md"

[project.scripts]
vai = "vietnamese_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["vietnamese_ai*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
vietnamese_ai = ["py.typed", "*.pyi", "*.so", "*.pyd", "*.dylib", "rag/legal/data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
